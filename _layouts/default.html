<!doctype html>
<html lang="{{ page.locale }}">
{% assign t = site.data[page.locale] %}
{% if page.locale == 'ko' %}{% assign other = site.data.en %}{% else %}{% assign other = site.data.ko %}{% endif %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ t.pages[page.page_key].description }}">
  <meta name="theme-color" content="#f3eddf">
  <title>{{ t.pages[page.page_key].title }}</title>
  <link rel="alternate" hreflang="ko" href="{{ site.url }}{{ site.data.ko.routes[page.page_key] }}">
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ site.data.en.routes[page.page_key] }}">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
</body>
</html>
