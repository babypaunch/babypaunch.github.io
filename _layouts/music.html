---
layout: default
---
{% assign t = site.data[page.locale] %}
<main id="main" class="music-shell">
  <header class="music-header">
    <p class="eyebrow">{{ t.music.eyebrow }}</p>
    <h1>{{ t.music.heading }}</h1>
    <p>{{ t.music.intro }}</p>
  </header>

  <section class="music-releases" aria-label="{{ t.music.releases_label }}">
    {% for track in site.data.music %}
    <section class="music-release" id="{{ track.slug }}" aria-label="{{ track.title }}">
      <div class="music-video">
        <iframe src="https://www.youtube-nocookie.com/embed/{{ track.youtube_id }}?rel=0" title="{{ track.title }} — {{ t.music.youtube_player }}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <iframe class="spotify-player" src="https://open.spotify.com/embed/track/{{ track.spotify_id }}?utm_source=generator&amp;theme=0" title="{{ track.title }} — {{ t.music.spotify_player }}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </section>
    {% endfor %}
  </section>
</main>
