---
layout: default
---
{% assign t = site.data[page.locale] %}
<main id="main" class="article-shell">
  <header class="article-header">
    <p class="eyebrow"><span lang="en">{{ page.category }}</span> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time></p>
    <h1>{{ page.title }}</h1>
    <p>{{ page.description }}</p>
  </header>
  <article class="article-body">
    {{ content }}
  </article>
  <a class="text-link article-back" href="{{ t.routes.blog }}">{{ t.blog.back }}</a>
</main>
