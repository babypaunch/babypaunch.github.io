<a class="skip-link" href="#main">{{ t.skip_link }}</a>
<header class="site-header">
  <a class="brand" href="{{ t.routes.home }}" aria-label="{{ t.brand_label }}">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <circle cx="16" cy="16" r="16" fill="var(--accent)"/>
      <g fill="var(--paper)" stroke="var(--paper)" stroke-width="24" stroke-linejoin="round" transform="translate(7.72 20.5) scale(.016 -.016)">
        <path d="M167 -15Q118 -15 87.5 11.5Q57 38 57 92Q57 128 65.5 172Q74 216 83 260L144 568Q152 611 113 624L95 631L96 641L292 697L298 690L231 383Q272 434 322.5 465Q373 496 417 496Q461 496 489.5 465Q518 434 518 361Q518 305 498 250.5Q478 196 443 148Q408 100 363.5 63.5Q319 27 268.5 6Q218 -15 167 -15ZM175 76Q175 51 185 34.5Q195 18 217 18Q271 18 319 80Q339 106 355.5 146Q372 186 381.5 231Q391 276 391 317Q391 371 376 398Q361 425 335 425Q311 425 284.5 406Q258 387 228 354L201 230Q189 173 182 134.5Q175 96 175 76Z"/>
        <path transform="translate(512)" d="M211 -15Q185 -15 161 -4Q150 -54 142 -94Q134 -134 128 -170Q123 -203 156 -212L181 -220L179 -230H-62L-60 -220L-41 -215Q-6 -205 1 -170L114 369Q121 408 86 424L67 432L69 443L254 497L264 489L243 384Q282 433 332.5 464.5Q383 496 427 496Q468 496 498 467Q528 438 528 362Q528 307 509.5 253Q491 199 458.5 150.5Q426 102 385 65Q344 28 299 6.5Q254 -15 211 -15ZM340 422Q317 422 290 404Q263 386 237 354L178 65Q215 28 255 28Q314 28 352 90Q366 114 378 151Q390 188 397.5 231.5Q405 275 405 316Q405 366 388.5 394Q372 422 340 422Z"/>

    </svg>
    <span>BabyPaunch</span>
  </a>
  <nav aria-label="{{ t.nav_label }}">
    <a href="{{ t.routes.home }}#about" lang="en">About</a>
    <a href="{{ t.routes.home }}#apps" lang="en">Apps</a>
    <a href="{{ t.routes.music }}" lang="en"{% if page.page_key == 'music' %} aria-current="page"{% endif %}>Music</a>
    <a href="{{ t.routes.blog }}" lang="en"{% if page.page_key == 'blog' %} aria-current="page"{% endif %}>Blog</a>
    <a href="{{ t.routes.policies }}" lang="en"{% if page.page_key == 'policies' or page.page_key == 'privacy' or page.page_key == 'accessibility' %} aria-current="page"{% endif %}>Policies</a>
    <a class="language-link" href="{{ page.language_url | default: other.routes[page.page_key] }}" lang="{{ other.lang }}" hreflang="{{ other.lang }}" aria-label="{{ other.language_switch_label }}">
      <span class="visually-hidden">{{ other.language_switch_label }}</span>
      {% if other.lang == 'ko' %}
      <img class="language-flag" src="/assets/flags/kr.svg" width="640" height="480" alt="">
      {% else %}
      <img class="language-flag" src="/assets/flags/gb.svg" width="640" height="480" alt="">
      {% endif %}
    </a>
  </nav>
</header>
